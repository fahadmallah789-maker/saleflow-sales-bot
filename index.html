<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaleFlow</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .card {
      padding: 40px;
      border-radius: 20px;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

    .status {
      margin-top: 20px;
      padding: 10px 18px;
      border-radius: 10px;
      background: #166534;
      display: inline-block;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>SaleFlow</h1>
    <p>Sales Management Application</p>
    <div class="status">✓ Website is Live</div>
  </div>
</body>
</html>
